[project]
name = "food-fanatic"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2.8,<5.3",
    "Pillow>=11.1,<13",
    "crispy-bootstrap5>=2025.6,<2027",
    "django-crispy-forms>=2.4,<3",
    "django-environ>=0.12,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel.scripts]
build = 'if [ -n "$DATABASE_URL" ] || [ -n "$POSTGRES_URL" ]; then python manage.py migrate --noinput; fi'
